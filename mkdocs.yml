# Site gerado por .github/workflows/pages.yml; .github/build_site.py prepara o _docs antes.
site_name: Refactoring Skill
site_description: "Os catálogos de refatoração de Fowler e Kerievsky como Agent Skill: 29 smells, 66 refatorações, 27 refatorações para padrões, exemplos em C#."
site_url: https://gabrieldulolmarques.github.io/refactoring-skill/pt-br/
repo_url: https://github.com/gabrieldulolmarques/refactoring-skill
docs_dir: _docs
theme:
  name: material
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
extra:
  alternate:
    - name: Português (Brasil)
      link: /refactoring-skill/pt-br/
      lang: pt-BR
    - name: English
      link: /refactoring-skill/en/
      lang: en
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
