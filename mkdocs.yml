# Site built by .github/workflows/pages.yml; .github/build_site.py prepares _docs first.
site_name: Refactoring Skill
site_description: "Fowler's and Kerievsky's refactoring catalogs as an Agent Skill: 29 smells, 66 refactorings, 27 refactorings to patterns, C# examples."
site_url: https://gabrieldulolmarques.github.io/refactoring-skill/en/
repo_url: https://github.com/gabrieldulolmarques/refactoring-skill
docs_dir: _docs
theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
extra:
  alternate:
    - name: English
      link: /refactoring-skill/en/
      lang: en
    - name: Português (Brasil)
      link: /refactoring-skill/pt-br/
      lang: pt-BR
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
