# Site built by .github/workflows/pages.yml; .github/build_site.py prepares _docs first.
site_name: Fowler Refactoring Skill
site_description: "Martin Fowler's refactoring catalog as an Agent Skill: 24 smells, 66 refactorings, C# examples."
site_url: https://gabrieldulolmarques.github.io/fowler-refactoring-skill/en/
repo_url: https://github.com/gabrieldulolmarques/fowler-refactoring-skill
docs_dir: _docs
theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.path
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
extra:
  alternate:
    - name: English
      link: /fowler-refactoring-skill/en/
      lang: en
    - name: Português (Brasil)
      link: /fowler-refactoring-skill/pt-br/
      lang: pt-BR
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
nav:
